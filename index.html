<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="0; url=timer-belajar.html">
<title>Timer Belajar Seru</title>
<style>
  html,body{height:100%}
  body{
    margin:0;display:grid;place-items:center;padding:24px;text-align:center;
    background:radial-gradient(circle at 50% 20%,#241650,#120c2b 60%);
    color:#f6f2ff;font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,Arial,sans-serif;
  }
  .dot{
    width:46px;height:46px;margin:0 auto 18px;border-radius:50%;
    background:conic-gradient(#ff4d6d,#ffd166,#22d3ee,#8b5cf6,#ff4d6d);
    animation:spin 1.1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  p{margin:0 0 8px;color:#b3aad2;font-size:.9rem}
  a{color:#ffd166}
</style>
</head>
<body>
  <div>
    <div class="dot" aria-hidden="true"></div>
    <p>Membuka timer belajar...</p>
    <p><a href="timer-belajar.html">Klik di sini kalau tidak berpindah otomatis</a></p>
  </div>
  <script>location.replace("timer-belajar.html");</script>
</body>
</html>
